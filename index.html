  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Comprehensive surveillance hub and AI object detection console for Frigate NVR with live camera feeds, event timeline, zone editor, multi-channel Gmail, Slack, and Discord event notifications, and camera stream management." />
    <meta property="og:title" content="WatchTower" />
    <meta property="og:description" content="Comprehensive surveillance hub and AI object detection console for Frigate NVR with live camera feeds, event timeline, zone editor, multi-channel Gmail, Slack, and Discord event notifications, and camera stream management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0f1216" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Apply the saved theme (default: starlink) before React mounts, so the login screen matches too.
      (function () {
        var theme = 'starlink';
        try { theme = localStorage.getItem('watchtower_theme') || 'starlink'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.body.setAttribute('data-theme', theme);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
